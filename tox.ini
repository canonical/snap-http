[tox]
isolated_build = true
env_list =
    py38
    py39
    py310
    py311
    py312
    py313
    py314

[testenv]
skip_install = true
allowlist_externals =
    uv
commands_pre =
    uv sync --group test --active
commands =
    uv run --active pytest tests/unit --cov snap_http/ --cov-branch \
        --cov-report term-missing --cov-fail-under 94 --import-mode importlib
