[project]
name = "snap-http"
version = "1.12.1"
description = "A library for interacting with snapd via its REST API."
authors = [
    { name = "Mitch Burton", email = "mitch.burton@canonical.com" },
    { name = "Stephen Mwangi", email = "mail@stephenmwangi.com" },
]
requires-python = ">=3.8"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
test = [
    "pytest>=8.3.5,<9",
    "pytest-cov>=5.0.0,<6",
    "pyyaml>=6.0,<7",
    "tox>=4.25.0,<5",
    "tox-uv>=1.13.1",
]
dev = [
    "ruff>=0.14.14,<0.15",
    "mypy>=1.14.1,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["tests/"]
wheel-exclude = ["tests/"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
    ".tox",
    "snap_http/__init__.py",
    "snap_http/api/__init__.py",
]

[tool.ruff.lint.mccabe]
max-complexity = 10
